<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Bar chart of an example mana curve">
  <style>
    .bar{fill:#2f5c3b}.t{fill:#1c211d;font:14px system-ui,sans-serif}.a{stroke:#5b645d}
    @media (prefers-color-scheme:dark){.bar{fill:#86bb91}.t{fill:#e4e7e0}.a{stroke:#98a299}}
  </style>
  <line class="a" x1="40" y1="210" x2="500" y2="210"/>
  <g class="bar">
    <rect x="60" y="50" width="56" height="160"/><rect x="146" y="80" width="56" height="130"/>
    <rect x="232" y="120" width="56" height="90"/><rect x="318" y="170" width="56" height="40"/>
    <rect x="404" y="195" width="56" height="15"/>
  </g>
  <g class="t" text-anchor="middle">
    <text x="88" y="42">16</text><text x="174" y="72">13</text><text x="260" y="112">9</text>
    <text x="346" y="162">4</text><text x="432" y="187">2</text>
    <text x="88" y="232">1</text><text x="174" y="232">2</text><text x="260" y="232">3</text>
    <text x="346" y="232">4</text><text x="432" y="232">5+</text>
  </g>
</svg>
